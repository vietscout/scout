<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.25" r="0.5">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.82" cy="0.75" r="0.45">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="640" rx="24" fill="url(#glow1)"/>
  <rect width="1280" height="640" rx="24" fill="url(#glow2)"/>

  <!-- Pill badge -->
  <rect x="96" y="108" width="290" height="38" rx="19" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <circle cx="120" cy="127" r="5" fill="#10B981"/>
  <text x="136" y="133" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Obsidian-Inspired · Open Source</text>

  <!-- Title -->
  <text x="96" y="230" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5">Pro GitHub Starter Kit</text>
  <text x="96" y="292" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400">Modular Themes, Automation Plugins, Live Web Builder &amp; SEO/GEO.</text>

  <!-- Feature chips -->
  <rect x="96" y="346" width="168" height="46" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-opacity="0.6"/>
  <text x="180" y="375" text-anchor="middle" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="18" font-weight="600">9 Themes</text>

  <rect x="282" y="346" width="176" height="46" rx="12" fill="#1E293B" stroke="#A855F7" stroke-opacity="0.6"/>
  <text x="370" y="375" text-anchor="middle" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="18" font-weight="600">12 Plugins</text>

  <rect x="476" y="346" width="214" height="46" rx="12" fill="#1E293B" stroke="#10B981" stroke-opacity="0.6"/>
  <text x="583" y="375" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Live Web Builder</text>

  <rect x="708" y="346" width="220" height="46" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.6"/>
  <text x="818" y="375" text-anchor="middle" fill="#FCD34D" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Legit Badges &amp; SEO</text>

  <!-- Bottom terminal preview card -->
  <rect x="96" y="438" width="1088" height="114" rx="16" fill="#030712" fill-opacity="0.85" stroke="#1F2937" stroke-width="1.5"/>
  <circle cx="126" cy="466" r="6" fill="#EF4444"/>
  <circle cx="148" cy="466" r="6" fill="#F59E0B"/>
  <circle cx="170" cy="466" r="6" fill="#10B981"/>
  <text x="126" y="516" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600">$ python setup.py --theme indie-maker --plugins blog-rss,skill-icons,github-stats</text>
</svg>
