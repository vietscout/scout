name: Validate Themes, Plugins & Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate theme and plugin manifests
        run: python setup.py --validate

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Auto-sync README catalog on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'cmduyeen/pro-github-starter-kit'
        run: |
          python setup.py --sync-readme
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/catalog.json
          if git diff --cached --quiet; then
            echo "README catalog already up to date."
          else
            git commit -m "docs: auto-sync themes and plugins catalog in README"
            git push
          fi
